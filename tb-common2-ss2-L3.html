    .row .lab { width:70px; font-weight:800; font-size:14px; color:var(--ink2,#334155); }

    .btn .arrow { margin-left:auto; color:#cbd5e1; font-size:20px; } .btn:hover .arrow { color:var(--c); }
    .chip { display:inline-flex; align-items:center; border:2px solid var(--c-line); border-radius:999px; padding:5px 14px; font-weight:800; font-size:14px; text-decoration:none; color:var(--c-ink); background:#fff; }
