  {"n":31,"p":"D","t":"mc","s":"[연결어 분석]에 근거하여, #42의 'however'가 기능하는 바와 두 문장의 관계에 대한 설명으로 옳은 것은?","o":["프랑스 내부의 성공적 전환과 대비하여 글로벌 시장에서의 실패를 지적하는 역접 연결어이다.","국내적 한정 효과에서 전 세계적 파급력으로 공간적 적용 범위를 대조·확장하며, 두 문장 모두 미래 지향적 전망을 담아 추상성의 정도가 같다.","앞 문장의 추상적 비전을 본문장에서 지극히 구체적인 법적 규제 조항으로 격하시키는 연결어이다.","지수 도입의 긍정적 영향이 향후 사라질 것임을 경고하는 반전 장치이다.","전 세계 경제 위기를 설명하기 위해 국내적 환경 성과를 예외적 사례로 한정하는 연결어이다."],"a":2,"e":"[연결어 분석 #42] however는 국내적 한정 효과와 글로벌 파급력을 공간적 적용 범위 면에서 대조·확장하며, 두 문장은 모두 미래 지향적 전망을 담아 추상성의 정도가 같습니다."},
  {"n":32,"p":"E","t":"blanks","s":"English Summary를 바탕으로 빈칸 (A)와 (B)에 들어갈 알맞은 단어를 본문에서 찾아 쓰시오. (필요시 어형 변화)","c":"In 2021, France mandated a repairability index across five categories. This legislation empowers consumers to make sustainable decisions and pressures manufacturers into repair-friendly engineering, with fewer items ending up in its (A) l________ to achieve a more (B) s________ society.","blanks":[["(A)",["landfills"]],["(B)",["sustainable"]]],"show":"(A) landfills (B) sustainable","e":"[Summary & #41] #41 ending up in its landfills / a more sustainable society"},
  {"n":33,"p":"E","t":"fix","s":"다음 글에서 분석지의 내신 출제 포인트(★)에 어긋난 어법상 오류 4개를 찾아 바르게 고치시오. (순서 무관)","c":"In January 2021, the French government passed a bill that requires that every manufacturer includes a \"repairability index\". Secondly, it encourages manufacturers to make their products more easily to repair. As a result, with fewer electronic and electrical items ended up in its landfills, France can expect to make a transition to a more sustainable society. Finally, we can anticipate to see more countries around the world following France's lead.","keys":[{"k":"include","show":"includes → include"},{"k":"easier","show":"more easily → easier"},{"k":"ending","show":"ended → ending"},{"k":"seeing","show":"to see → seeing"}],"e":"[구문 분석 #34, #40, #41, #44 ★] ① require that절 내부 (should) include ② make의 목적격 보어 형용사 easier ③ with + 목적어 + 분사 구문의 능동 진행 ending up ④ anticipate는 동명사 목적어를 취하므로 seeing"},
  {"n":34,"p":"E","t":"kw","s":"#34의 that every manufacturer include 문장에서 주어가 3인칭 단수임에도 불구하고 단수 동사 includes가 아닌 원형 'include'가 쓰인 이유를 [요구 동사], [당위성], [생략] 키워드를 사용하여 서술하시오.","groups":[["요구 동사","require"],["당위성"],["생략","should"]],"show":"주절의 동사 requires가 요구 동사이므로 that절 내부에 당위성을 나타내는 'should + 동사원형'이 쓰여야 하는데, 이때 should가 생략되어 원형 include가 쓰였기 때문이다.","e":"[구문 분석 #34 ★★★] require와 같은 제안/요구/주장/명령 동사 뒤의 that절에는 당위성을 뜻하는 (should) + 동사원형이 오며 should가 생략된 형태입니다."},
