<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>내 결과 | S영어전문학원 내신 학습</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e2e8f0;
            --c:#0ea5e9; --c-line:#bae6fd; --c-soft:#f0f9ff; --c-ink:#0369a1;
            --ok:#15803d; --oksoft:#dcfce7; --bad:#b91c1c; --badsoft:#fee2e2; --wait:#b45309; --waitsoft:#fef3c7; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; line-height:1.6; }
    .wrap { max-width:880px; margin:0 auto; padding:24px 16px 80px; }
    .top { font-size:14px; margin-bottom:14px; } .top a { color:var(--c-ink); font-weight:800; text-decoration:none; }
    header { background:var(--card); border:1px solid var(--line); border-top:6px solid var(--c); border-radius:18px; padding:24px; box-shadow:0 8px 24px -14px rgba(15,23,42,.25); margin-bottom:12px; }
    header .academy { margin:0; font-size:13px; font-weight:800; color:var(--muted); }
    header h1 { margin:2px 0 4px; font-size:26px; font-weight:900; color:var(--c-ink); }
    header p { margin:0; color:var(--muted); font-size:14px; }
    header .who b { color:var(--ink); } header .who a { color:var(--c-ink); font-weight:700; }
    .note { font-size:13px; color:var(--muted); margin:0 4px 14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px; box-shadow:0 6px 18px -14px rgba(15,23,42,.25); }
    .card.wait { background:#f8fafc; }
    .head { display:flex; gap:12px; align-items:flex-start; }
    .head .t { flex:1; min-width:0; }
    .pg { font-weight:900; font-size:16px; }
    .sub { color:var(--muted); font-size:13px; }
    .score { text-align:right; white-space:nowrap; }
    .score b { font-size:26px; font-weight:900; color:var(--c-ink); line-height:1.1; } .score span { color:var(--muted); font-weight:700; }
    .badge { display:inline-block; font-size:12.5px; font-weight:800; border-radius:999px; padding:3px 12px; background:var(--waitsoft); color:var(--wait); white-space:nowrap; }
    .cmt { margin-top:12px; background:var(--c-soft); border:1px solid var(--c-line); border-radius:12px; padding:10px 14px; font-size:14.5px; white-space:pre-wrap; }
    .cmt b { display:block; font-size:12.5px; color:var(--c-ink); margin-bottom:2px; }
    .line { margin-top:10px; font-size:14px; }
    .line .lab { font-weight:800; color:var(--ink2); margin-right:6px; }
    .chip { display:inline-block; border-radius:999px; padding:1px 10px; margin:2px 3px 2px 0; font-size:13px; font-weight:800; background:var(--badsoft); color:var(--bad); }
    .chip.ok { background:var(--oksoft); color:var(--ok); } .chip.mid { background:var(--waitsoft); color:var(--wait); }
    .allok { color:var(--ok); font-weight:700; }
    details { margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
    summary { cursor:pointer; font-weight:800; font-size:14px; color:var(--c-ink); }
    .q { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:8px; font-size:14px; }
    .q .qn { font-weight:900; } .q .qp { color:var(--ink2); }
    .q .row { display:grid; grid-template-columns:52px 1fr; gap:2px 10px; margin-top:6px; }
    .q .row b { color:var(--muted); font-size:12.5px; padding-top:1px; }
    .q .mine { color:var(--bad); white-space:pre-wrap; } .q .right { color:var(--ok); font-weight:700; white-space:pre-wrap; }
    .empty { text-align:center; color:var(--muted); padding:40px 10px; }
    .err { color:var(--bad); font-weight:700; }
    .btn { border:1px solid var(--c-line); background:#fff; color:var(--c-ink); border-radius:999px; padding:6px 14px; font:inherit; font-weight:800; font-size:14px; cursor:pointer; }
    @media (max-width:600px) { header h1 { font-size:23px; } .score b { font-size:22px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><a href="index.html">← 메인으로</a></div>
    <header>
      <p class="academy">S영어전문학원 내신 학습</p>
      <h1>📊 내 결과</h1>
      <p class="who" id="who">학생 확인 중…</p>
    </header>
    <p class="note">시험지마다 가장 최근에 푼 것만 보여요. 선생님 채점이 끝난 시험지는 점수와 틀린 문항을 볼 수 있어요.</p>
    <div id="list"><div class="card empty">불러오는 중…</div></div>
  </div>

<script src="track.js"></script>
<script>
(function () {
  'use strict';
  const EP = window.NS_ENDPOINT || '';
  const list = document.getElementById('list'), who = document.getElementById('who');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = iso => { const d = new Date(iso); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  /* 선지는 학생마다 순서가 달라서 ①, ⓐ 같은 번호는 빼고 내용만 보여 줌 */
  const clean = s => String(s == null ? '' : s).replace(/(^|→\s*|\|\s*)[①-⑧ⓐ-ⓙ]\s*/g, '$1');
  const num = n => esc(String(n)) + (/^\d+$/.test(String(n)) ? '번' : '');
  const pt = x => Math.round(x * 100) / 100;

  function card(r) {
    const head = `<div class="t"><div class="pg">${esc(r.page)}</div><div class="sub">${esc(r.title)}</div><div class="sub">${fmt(r.time)} · ${esc(r.att)}회차</div></div>`;
    if (!r.done) return `<div class="card wait"><div class="head">${head}<span class="badge">선생님 채점 중</span></div></div>`;
    const wrong = r.wrong || [], written = r.written || [];
    return `<div class="card"><div class="head">${head}<div class="score"><b>${pt(r.final)}</b> <span>/ ${esc(r.total)}점</span></div></div>
      ${r.comment ? `<div class="cmt"><b>선생님 한마디</b>${esc(r.comment)}</div>` : ''}
      <div class="line"><span class="lab">틀린 문항</span>${wrong.length ? wrong.map(i => `<span class="chip">${num(i.n)}</span>`).join('') : '<span class="allok">모두 맞혔어요! 👏</span>'}</div>
      ${written.length ? `<div class="line"><span class="lab">서술형 점수</span>${written.map(i => `<span class="chip ${i.score >= 1 ? 'ok' : i.score > 0 ? 'mid' : ''}">${num(i.n)} ${pt(i.score)}점</span>`).join('')}</div>` : ''}
      ${wrong.length ? `<details><summary>틀린 문항과 답 보기 (${wrong.length})</summary>${wrong.map(i => `
        <div class="q"><span class="qn">${num(i.n)}</span>${i.score > 0 ? ` <span class="chip mid">${pt(i.score)}점</span>` : ''} <span class="qp">${esc(i.prompt)}</span>
          <div class="row"><b>내 답</b><span class="mine">${esc(clean(i.mine))}</span><b>정답</b><span class="right">${esc(clean(i.right))}</span></div></div>`).join('')}</details>` : ''}
    </div>`;
  }

  async function load(st) {
    who.innerHTML = `<b>${esc(st.name)}</b> (${esc(st.cls)}) · <a href="#" id="sw">내가 아니에요</a>`;
    document.getElementById('sw').onclick = e => { e.preventDefault(); window.NS_SWITCH && window.NS_SWITCH(); };
    if (!EP) { list.innerHTML = '<div class="card empty err">기록 주소가 아직 설정되지 않았어요.</div>'; return; }
    list.innerHTML = '<div class="card empty">불러오는 중…</div>';
    try {
      const r = await fetch(EP + '?' + new URLSearchParams({ action: 'mine', pin: st.pin || '' }));
      const d = await r.json();
      if (d.error === 'pin') {
        list.innerHTML = `<div class="card empty"><p class="err">비번이 바뀌었어요. 다시 들어와 주세요.</p><button class="btn" id="re">다시 들어가기</button></div>`;
        document.getElementById('re').onclick = () => window.NS_SWITCH && window.NS_SWITCH();
        return;
      }
      const rows = d.rows || [];
      list.innerHTML = rows.length ? rows.map(card).join('') : '<div class="card empty">아직 채점한 시험지가 없어요.<br>시험지를 풀고 「채점하기」를 누르면 여기에 나와요.</div>';
    } catch (e) {
      list.innerHTML = `<div class="card empty"><p class="err">결과를 불러오지 못했어요. 인터넷을 확인해 주세요.</p><button class="btn" onclick="location.reload()">다시 시도</button></div>`;
    }
  }

  if (window.NS_STUDENT && window.NS_STUDENT.sid) load(window.NS_STUDENT);
  else window.addEventListener('ns-student', e => load(e.detail));
})();
</script>
</body>
</html>
