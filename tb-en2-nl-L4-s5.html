  {"n":31,"p":"D","t":"mc","s":"[연결어 분석]에 근거하여, #56의 'Furthermore'가 기능하는 바와 두 문장의 관계에 대한 설명으로 옳은 것은?","o":["기기의 수명 연장(물리적 효용)에 이어 지속 가능한 관점 육성(철학적 가치)이라는 심화된 장점을 덧붙이며, 앞 문장은 상대적으로 구체적이고 본문장은 추상적이다.","앞 문장의 실용적 혜택과 상반되는 미래의 부정적 위험성을 경고하는 대조 연결어이다.","앞선 구체적 사례들을 모두 부정하고 새로운 환경 규제 법안을 제안하는 귀결 연결어이다.","수리 카페의 활동 범위를 전자기기에서 일반 가구로 축소 전환함을 나타내며 두 문장의 추상성은 같다.","자원봉사자 모집 기준의 구체적 변화를 시간 순서대로 나열하는 연결어이다."],"a":1,"e":"[연결어 분석 #56] furthermore는 실용적·물리적 효용에 심층적·철학적 가치를 덧붙이며, 구체적인 제품 관리에서 일반적 인식 전환으로 나아가므로 앞 문장이 상대적으로 구체적이고 본문장은 추상적입니다."},
  {"n":32,"p":"E","t":"blanks","s":"English Summary를 바탕으로 빈칸 (A)와 (B)에 들어갈 알맞은 단어를 본문에서 찾아 쓰시오. (필요시 어형 변화)","c":"Initiated in Amsterdam in 2009, Repair Cafés are thriving meeting places where volunteer experts offer tools and advice. These cafés help citizens repair devices, transfer (A) i________ knowledge, and foster a (B) s________ perspective for our future.","blanks":[["(A)",["invaluable"]],["(B)",["sustainable"]]],"show":"(A) invaluable (B) sustainable","e":"[Summary & #53, #56] #53 invaluable skills and knowledge / #56 foster a sustainable perspective"},

  {"n":34,"p":"E","t":"kw","s":"#47의 'That is why Repair Cafés were started' 문장에서 'That is because'를 쓰면 어법상 틀리는 이유를 [원인], [결과] 키워드를 사용하여 서술하시오.","groups":[["원인"],["결과"]],"show":"앞 문장의 내용이 원인이고 뒤 문장의 수리 카페 시작이 결과이므로, 'That is why + 결과' 구문을 써야 하며 원인을 이끄는 because는 쓸 수 없다.","e":"[구문 분석 #47 ★★★] 「That is why + 결과」 구문입니다. 앞 문장의 내용(적절한 도구와 조언이 있으면 스스로 수리 가능)이 '원인'이고, 수리 카페의 탄생이 '결과'이므로 That is because를 쓰면 틀립니다."},
